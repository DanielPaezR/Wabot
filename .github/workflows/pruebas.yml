name: Pruebas

# Corre todas las pruebas (incluidas las de PostgreSQL) en cada pull request y en cada push a las ramas principales.
on:
  pull_request:
  push:
    branches: [main, Rama_trabajo]

jobs:
  pruebas:
    runs-on: ubuntu-22.04       # fijo: ubuntu-latest ya no trae Python 3.9
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wabot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      # Producción corre en Python 3.9 (services/wabot_chat/runtime.txt): se prueba con la misma versión
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: services/wabot_chat/requirements.txt

      - name: Instalar dependencias
        run: pip install -r services/wabot_chat/requirements.txt

      - name: Ejecutar pruebas
        # carga schema.sql en la base del servicio, crea los datos de ejemplo y corre todo
        run: python tests/run_all.py --pg-url postgresql://postgres:postgres@127.0.0.1:5432/wabot_test
