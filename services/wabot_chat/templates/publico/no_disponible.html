{% extends 'publico/base.html' %}
{% block titulo %}{{ negocio.nombre }}{% endblock %}
{% block cuerpo %}
<main class="contenedor" style="min-height:100vh;display:grid;place-items:center;text-align:center">
  <div style="display:grid;gap:14px;justify-items:center">
    <div class="logo" style="margin:0">{% if negocio.logo %}<img src="{{ negocio.logo }}" alt="">{% else %}<span>{{ negocio.iniciales }}</span>{% endif %}</div>
    <h1>{{ negocio.nombre }}</h1>
    <p style="color:var(--texto-2)">Por ahora este negocio no recibe reservas en línea.</p>
    <a class="boton boton-suave" href="/">Ver otros negocios</a>
  </div>
</main>
{% endblock %}
