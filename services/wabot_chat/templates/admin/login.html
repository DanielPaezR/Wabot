<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso administrativo - Wabot</title>
    <meta name="theme-color" content="#0a0a0d">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/wabot-ui.css') }}?v=2">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--wb-font);
            background:
                radial-gradient(60% 50% at 50% 0%, color-mix(in srgb, var(--wb-accent) 22%, transparent), transparent 70%),
                var(--wb-bg);
            color: var(--wb-text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }
        .card { width: 100%; max-width: 400px; padding: 36px 32px; }
        .mark { display: flex; align-items: center; gap: 12px; font-family: var(--wb-display); font-size: 1.4rem; font-weight: 600; margin-bottom: 28px; }
        .mark span { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; background: var(--wb-accent); color: var(--wb-accent-ink); }
        h1 { font-family: var(--wb-display); font-weight: 600; font-size: 1.7rem; letter-spacing: -0.01em; }
        .sub { margin: 8px 0 26px; color: var(--wb-text-2); font-size: 0.92rem; }
        .badge-admin { margin-bottom: 18px; }
    </style>
</head>
<body>
    <main class="card wb-card">
        <div class="mark"><span>W</span> Wabot</div>
        <div class="wb-badge badge-admin">Acceso administrativo</div>
        <h1>Panel de administración</h1>
        <p class="sub">Solo para el equipo de Wabot.</p>

        {% if error %}
        <div class="wb-alert wb-alert-error" role="alert">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="wb-field">
                <label class="wb-label" for="username">Usuario</label>
                <input class="wb-input" type="text" id="username" name="username" required autocomplete="username" autofocus>
            </div>
            <div class="wb-field">
                <label class="wb-label" for="password">Contraseña</label>
                <input class="wb-input" type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
            </div>
            <button type="submit" class="wb-btn wb-btn-primary wb-btn-block">Iniciar sesión</button>
        </form>
    </main>
</body>
</html>
