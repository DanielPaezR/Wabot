<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a0a0d">
    <title>{{ titulo }} · Wabot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/wabot-ui.css') }}?v=1">
    <style>
        body { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; margin: 0; padding: 24px 16px; }
        .err { width: 100%; max-width: 420px; text-align: center; }
        .err .err-code {
            font-family: var(--wb-display); font-size: clamp(72px, 22vw, 112px); line-height: 1;
            color: var(--wb-accent); letter-spacing: -0.02em; margin: 0 0 8px;
        }
        .err h1 { font-family: var(--wb-display); font-size: 26px; font-weight: 600; margin: 0 0 10px; color: var(--wb-text); }
        .err p { color: var(--wb-text-2); margin: 0 0 28px; line-height: 1.55; }
        .err-acciones { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    </style>
</head>
<body>
    <main class="err">
        <p class="err-code" aria-hidden="true">{{ codigo }}</p>
        <h1>{{ titulo }}</h1>
        <p>{{ mensaje }}</p>
        <div class="err-acciones">
            <a class="wb-btn wb-btn-primary" href="/">Ir al inicio</a>
            <a class="wb-btn wb-btn-ghost" href="javascript:history.back()">Volver</a>
        </div>
    </main>
</body>
</html>
