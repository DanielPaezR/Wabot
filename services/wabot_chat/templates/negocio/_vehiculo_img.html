{# Foto del vehículo o, si no hay, una silueta de auto con el color de su categoría #}
{% macro vehiculo_img(v, clase='veh-img') -%}
{%- if v.foto_url -%}
<img class="{{ clase }}" src="{{ v.foto_url }}" alt="{{ v.nombre }}" loading="lazy">
{%- else -%}
<div class="{{ clase }} veh-ph" data-cat="{{ v.categoria }}" role="img" aria-label="{{ v.nombre }}">
<svg viewBox="0 0 120 60" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 40v-9c0-3 2-5 5-6l13-3 14-13c2-2 4-3 7-3h28c3 0 5 1 7 3l12 13 11 3c4 1 6 3 6 7v8c0 2-1 3-3 3h-6M32 43H11c-2 0-3-1-3-3M80 43H44"/><circle cx="35" cy="43" r="8"/><circle cx="87" cy="43" r="8"/><path d="M30 25h58"/></svg>
</div>
{%- endif -%}
{%- endmacro %}
